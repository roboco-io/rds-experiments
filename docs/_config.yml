title: DSQL 실험 노트
description: Aurora DSQL의 성능과 개발·운영 편의성을 기존 RDS·Aurora와 비교하는 공개 실험 기록
url: https://roboco.io
baseurl: /rds-experiments
repository_url: https://github.com/roboco-io/rds-experiments
lang: ko
timezone: Asia/Seoul
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
collections:
  experiments:
    output: true
    permalink: /experiments/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: experiments
    values:
      layout: experiment
exclude:
  - superpowers
  - README.md
  - artifacts
  - vendor
