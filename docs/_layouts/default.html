<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.question | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">D</span>{{ site.title }}</a>
    <nav aria-label="주 메뉴">
      <a href="{{ '/' | relative_url }}#experiments">실험 목록</a>
      <a href="{{ '/' | relative_url }}#results">공개 결과</a>
      <a href="{{ site.repository_url }}">GitHub</a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">
    <p>roboco-io <span aria-hidden="true">/</span> 공개 데이터베이스 실험 기록</p>
    <p><a href="{{ site.repository_url }}/blob/main/EXPERIMENT_PLAN.md">전체 실험 계획</a> · <a href="{{ site.repository_url }}/issues">진행 상황과 논의</a></p>
    <p class="footer-note">측정한 사실과 가정을 구분합니다. 원본 로그·자격 증명·개인정보는 공개하지 않습니다.</p>
  </footer>
</body>
</html>
