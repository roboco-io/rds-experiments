name: Publish experiment results

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate_reports.rb"
      - "scripts/check_site.py"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate_reports.rb"
      - "scripts/check_site.py"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Validate report metadata
        run: bundle exec ruby scripts/validate_reports.rb
      - name: Build public site
        run: bundle exec jekyll build --source docs --destination _site --trace
      - name: Check generated pages and local links
        run: python3 scripts/check_site.py
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
